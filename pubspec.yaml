name: parler
description: French learning app (FLELex A1-C2 + FSRS + RFI podcasts).
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1
  fsrs: ^2.0.1
  just_audio: ^0.10.6
  flutter_tts: ^4.2.5
  http: ^1.6.0
  xml: ^7.1.0
  html: ^0.15.7
  archive: ^4.0.7
  file_picker: ^10.3.3
  syncfusion_flutter_pdf: ^35.1.42
  pdfx: ^2.8.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
